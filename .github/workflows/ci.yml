name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - run: npm run build

      - name: Verify CLI entrypoint
        run: node dist/index.js --help

  integration-test:
    # Notes.app's scripting bridge data layer (NSPersistentCloudKitContainer)
    # requires a signed-in Apple account. On GHA runners without one, app-level
    # commands (name, activate) work but ALL data queries (accounts, notes,
    # folders) hang indefinitely. This is a known Apple limitation — TCC
    # permissions, dialog dismissal, and local DB creation don't help.
    # Tests skip gracefully via preflight check; the help-all test still runs.
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run test:integration
