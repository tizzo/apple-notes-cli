name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - run: npm run build

      - name: Verify CLI entrypoint
        run: node dist/index.js --help

  integration-test:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Setup Notes.app for CI
        run: |
          set -euo pipefail

          # Grant TCC permissions (SIP disabled on macos-15 runners)
          TIMESTAMP=$(date +%s)
          tcc_insert() {
            local db="$1" client="$2" sudo_prefix="${3:-}"
            $sudo_prefix sqlite3 "$db" \
              "INSERT OR REPLACE INTO access (service, client, client_type, auth_value, auth_reason, auth_version, indirect_object_identifier_type, indirect_object_identifier, last_modified) VALUES ('kTCCServiceAppleEvents', '$client', 1, 2, 3, 1, 0, 'com.apple.Notes', $TIMESTAMP);" 2>&1 || true
          }
          USER_TCC="$HOME/Library/Application Support/com.apple.TCC/TCC.db"
          SYS_TCC="/Library/Application Support/com.apple.TCC/TCC.db"
          for client in /usr/bin/osascript /bin/bash /bin/zsh; do
            tcc_insert "$USER_TCC" "$client"
            tcc_insert "$SYS_TCC" "$client" "sudo"
          done
          # Also grant screen capture permission for screencapture tool
          for client in /usr/sbin/screencapture /bin/bash /bin/zsh; do
            for db in "$USER_TCC" "$SYS_TCC"; do
              sudo_prefix=""
              [[ "$db" == "$SYS_TCC" ]] && sudo_prefix="sudo"
              $sudo_prefix sqlite3 "$db" \
                "INSERT OR REPLACE INTO access (service, client, client_type, auth_value, auth_reason, auth_version, indirect_object_identifier_type, indirect_object_identifier, last_modified) VALUES ('kTCCServiceScreenCapture', '$client', 1, 2, 3, 1, 0, 'UNUSED', $TIMESTAMP);" 2>&1 || true
            done
          done

          # Step 1: Initialize database (first launch creates "On My Mac" account)
          open -a Notes
          sleep 3
          killall Notes 2>/dev/null || true
          sleep 1

          # Step 2: Relaunch and dismiss Welcome dialog
          open -a Notes
          sleep 3
          echo "Dismissing Welcome dialog..."
          /usr/bin/osascript -l JavaScript -e '
            var se = Application("System Events");
            var p = se.processes.byName("Notes");
            var wins = p.windows();
            for (var i = 0; i < wins.length; i++) {
              var buttons = wins[i].buttons();
              for (var j = 0; j < buttons.length; j++) {
                try { if (buttons[j].name() === "Continue") buttons[j].click(); } catch(e) {}
              }
            }
          ' 2>/dev/null || true
          sleep 2

          # Step 3: Dismiss "Turn On iCloud" sheet
          # After Welcome, Notes shows a modal sheet asking to enable iCloud.
          # This sheet blocks all scripting bridge data access until dismissed.
          echo "Dismissing Turn On iCloud sheet..."
          /usr/bin/osascript -l JavaScript -e '
            var se = Application("System Events");
            var p = se.processes.byName("Notes");
            var wins = p.windows();
            var dismissed = false;
            for (var i = 0; i < wins.length; i++) {
              // Check sheets (modal dialogs attached to windows)
              try {
                var sheets = wins[i].sheets();
                for (var s = 0; s < sheets.length; s++) {
                  var buttons = sheets[s].buttons();
                  var names = buttons.map(function(b) { try { return b.name(); } catch(e) { return "?"; } });
                  JSON.stringify({sheetButtons: names});
                  // Click any dismiss-type button
                  for (var b = 0; b < buttons.length; b++) {
                    try {
                      var bname = buttons[b].name();
                      // "Not Now" or "Dismiss" or whatever the non-iCloud option is
                      if (bname !== "System Settings") {
                        buttons[b].click();
                        dismissed = true;
                        break;
                      }
                    } catch(e) {}
                  }
                  if (dismissed) break;
                }
              } catch(e) {}

              // If no dismiss button found, try pressing Escape to close the sheet
              if (!dismissed) {
                try {
                  se.keystroke(String.fromCharCode(27)); // Escape key
                } catch(e) {}
              }
            }
            JSON.stringify({dismissed: dismissed});
          ' 2>&1 || true
          sleep 2

          # Take screenshot to see current state
          mkdir -p /tmp/screenshots
          screencapture -x /tmp/screenshots/01-after-both-dialogs.png 2>/dev/null || true

          # Dump accessibility tree to check for remaining dialogs
          echo "=== UI state after dialog dismissal ==="
          /usr/bin/osascript -l JavaScript -e '
            var se = Application("System Events");
            var p = se.processes.byName("Notes");
            var wins = p.windows();
            var result = [];
            for (var i = 0; i < wins.length; i++) {
              var w = wins[i];
              var winfo = {name: "", sheets: 0, buttons: []};
              try { winfo.name = w.name(); } catch(e) {}
              try { winfo.sheets = w.sheets().length; } catch(e) {}
              try { winfo.buttons = w.buttons().map(function(b) { try { return b.name() || b.description(); } catch(e) { return "?"; } }); } catch(e) {}
              try {
                var sheets = w.sheets();
                winfo.sheetButtons = [];
                for (var s = 0; s < sheets.length; s++) {
                  var sb = sheets[s].buttons();
                  winfo.sheetButtons.push(sb.map(function(b) { try { return b.name(); } catch(e) { return "?"; } }));
                }
              } catch(e) {}
              result.push(winfo);
            }
            JSON.stringify(result, null, 2);
          ' 2>&1 || true

          # Step 4: Test if data queries work now
          echo ""
          echo "=== Testing data access ==="
          /usr/bin/osascript -l JavaScript -e '
            var app = Application("Notes");
            JSON.stringify({ok: true, accounts: app.accounts().length});
          ' &
          QUERY_PID=$!
          for i in $(seq 1 15); do
            if ! kill -0 $QUERY_PID 2>/dev/null; then break; fi
            sleep 1
          done
          if kill -0 $QUERY_PID 2>/dev/null; then
            echo "Data query still hanging after 15s"
            screencapture -x /tmp/screenshots/02-still-hanging.png 2>/dev/null || true
            kill $QUERY_PID 2>/dev/null || true
            wait $QUERY_PID 2>/dev/null || true
          else
            wait $QUERY_PID && echo "DATA ACCESS WORKS!" || echo "Query failed (but didn't hang)"
          fi

      - name: Run integration tests
        run: npm run test:integration

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notes-app-screenshots
          path: /tmp/screenshots/
          if-no-files-found: ignore
