name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - run: npm run build

      - name: Verify CLI entrypoint
        run: node dist/index.js --help

  integration-test:
    # Notes.app integration tests require macOS with a signed-in Apple account.
    # On GHA runners (no Apple account), the scripting bridge's data layer never
    # initializes — app.name()/activate() work but accounts/notes/folders hang.
    # TCC permissions, Welcome dialog dismissal, and local DB creation all
    # succeed, but it's not enough. Tests skip gracefully via preflight check.
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Setup Notes.app permissions
        run: |
          # Grant osascript TCC permissions for Notes.app
          # SIP is disabled on macos-15 GHA runners
          TIMESTAMP=$(date +%s)
          tcc_insert() {
            local db="$1" client="$2" sudo_prefix="${3:-}"
            $sudo_prefix sqlite3 "$db" \
              "INSERT OR REPLACE INTO access (service, client, client_type, auth_value, auth_reason, auth_version, indirect_object_identifier_type, indirect_object_identifier, last_modified) VALUES ('kTCCServiceAppleEvents', '$client', 1, 2, 3, 1, 0, 'com.apple.Notes', $TIMESTAMP);" 2>&1 || true
          }
          USER_TCC="$HOME/Library/Application Support/com.apple.TCC/TCC.db"
          SYS_TCC="/Library/Application Support/com.apple.TCC/TCC.db"
          for client in /usr/bin/osascript /bin/bash /bin/zsh; do
            tcc_insert "$USER_TCC" "$client"
            tcc_insert "$SYS_TCC" "$client" "sudo"
          done

          # Initialize Notes.app database (creates "On My Mac" local account)
          open -a Notes
          sleep 3
          killall Notes 2>/dev/null || true
          sleep 1

          # Dismiss first-run Welcome dialog on relaunch
          open -a Notes
          sleep 3
          /usr/bin/osascript -l JavaScript -e '
            var se = Application("System Events");
            var p = se.processes.byName("Notes");
            var wins = p.windows();
            for (var i = 0; i < wins.length; i++) {
              var buttons = wins[i].buttons();
              for (var j = 0; j < buttons.length; j++) {
                try { if (buttons[j].name() === "Continue") buttons[j].click(); } catch(e) {}
              }
            }
          ' 2>/dev/null || true
          sleep 3

          # Screenshot the desktop while Notes.app is running
          mkdir -p /tmp/screenshots
          screencapture -x /tmp/screenshots/01-after-welcome-dismiss.png
          echo "Screenshot taken after Welcome dialog dismissal"

          # Start a data query in the background (this is what hangs)
          /usr/bin/osascript -l JavaScript -e '
            var app = Application("Notes");
            JSON.stringify({accounts: app.accounts().length});
          ' &
          QUERY_PID=$!
          sleep 5

          # Screenshot while the query is hanging
          screencapture -x /tmp/screenshots/02-during-data-query-hang.png
          echo "Screenshot taken during data query hang"

          # Kill the hung query
          kill $QUERY_PID 2>/dev/null || true
          wait $QUERY_PID 2>/dev/null || true

          # Also dump the full accessibility tree of the Notes window
          echo "=== Accessibility tree of Notes window ==="
          /usr/bin/osascript -l JavaScript -e '
            var se = Application("System Events");
            var p = se.processes.byName("Notes");
            function dumpElement(el, depth) {
              if (depth > 4) return "";
              var indent = "  ".repeat(depth);
              var info = "";
              try { info += el.role(); } catch(e) { info += "?"; }
              try { var n = el.name(); if (n) info += " \"" + n + "\""; } catch(e) {}
              try { var v = el.value(); if (v !== null && v !== undefined) info += " val=" + JSON.stringify(v).slice(0, 50); } catch(e) {}
              try { var d = el.description(); if (d) info += " desc=\"" + d + "\""; } catch(e) {}
              var result = indent + info + "\n";
              try {
                var children = el.uiElements();
                for (var i = 0; i < children.length && i < 20; i++) {
                  result += dumpElement(children[i], depth + 1);
                }
                if (children.length > 20) result += indent + "  ... (" + (children.length - 20) + " more)\n";
              } catch(e) {}
              return result;
            }
            var wins = p.windows();
            var output = "";
            for (var i = 0; i < wins.length; i++) {
              output += dumpElement(wins[i], 0);
            }
            output;
          ' 2>&1 || echo "(accessibility dump failed)"

      - name: Run integration tests
        run: npm run test:integration

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notes-app-screenshots
          path: /tmp/screenshots/
          if-no-files-found: ignore
