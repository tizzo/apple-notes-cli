name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - run: npm run build

      - name: Verify CLI entrypoint
        run: node dist/index.js --help

  integration-test:
    # Notes.app integration tests require macOS with a signed-in Apple account.
    # On GHA runners (no Apple account), the scripting bridge's data layer never
    # initializes — app.name()/activate() work but accounts/notes/folders hang.
    # TCC permissions, Welcome dialog dismissal, and local DB creation all
    # succeed, but it's not enough. Tests skip gracefully via preflight check.
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Setup Notes.app permissions
        run: |
          # Grant osascript TCC permissions for Notes.app
          # SIP is disabled on macos-15 GHA runners
          TIMESTAMP=$(date +%s)
          tcc_insert() {
            local db="$1" client="$2" sudo_prefix="${3:-}"
            $sudo_prefix sqlite3 "$db" \
              "INSERT OR REPLACE INTO access (service, client, client_type, auth_value, auth_reason, auth_version, indirect_object_identifier_type, indirect_object_identifier, last_modified) VALUES ('kTCCServiceAppleEvents', '$client', 1, 2, 3, 1, 0, 'com.apple.Notes', $TIMESTAMP);" 2>&1 || true
          }
          USER_TCC="$HOME/Library/Application Support/com.apple.TCC/TCC.db"
          SYS_TCC="/Library/Application Support/com.apple.TCC/TCC.db"
          for client in /usr/bin/osascript /bin/bash /bin/zsh; do
            tcc_insert "$USER_TCC" "$client"
            tcc_insert "$SYS_TCC" "$client" "sudo"
          done

          # Initialize Notes.app database (creates "On My Mac" local account)
          open -a Notes
          sleep 3
          killall Notes 2>/dev/null || true
          sleep 1

          # Dismiss first-run Welcome dialog on relaunch
          open -a Notes
          sleep 3
          /usr/bin/osascript -l JavaScript -e '
            var se = Application("System Events");
            var p = se.processes.byName("Notes");
            var wins = p.windows();
            for (var i = 0; i < wins.length; i++) {
              var buttons = wins[i].buttons();
              for (var j = 0; j < buttons.length; j++) {
                try { if (buttons[j].name() === "Continue") buttons[j].click(); } catch(e) {}
              }
            }
          ' 2>/dev/null || true

      - name: Run integration tests
        run: npm run test:integration
