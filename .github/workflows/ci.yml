name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - run: npm run build

      - name: Verify CLI entrypoint
        run: node dist/index.js --help

  integration-test:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Setup Notes.app for CI
        run: |
          set -euo pipefail

          # Grant TCC permissions (SIP disabled on macos-15 runners)
          TIMESTAMP=$(date +%s)
          tcc_insert() {
            local db="$1" client="$2" sudo_prefix="${3:-}"
            $sudo_prefix sqlite3 "$db" \
              "INSERT OR REPLACE INTO access (service, client, client_type, auth_value, auth_reason, auth_version, indirect_object_identifier_type, indirect_object_identifier, last_modified) VALUES ('kTCCServiceAppleEvents', '$client', 1, 2, 3, 1, 0, 'com.apple.Notes', $TIMESTAMP);" 2>&1 || true
          }
          USER_TCC="$HOME/Library/Application Support/com.apple.TCC/TCC.db"
          SYS_TCC="/Library/Application Support/com.apple.TCC/TCC.db"
          for client in /usr/bin/osascript /bin/bash /bin/zsh; do
            tcc_insert "$USER_TCC" "$client"
            tcc_insert "$SYS_TCC" "$client" "sudo"
          done

          # Step 1: First launch to create database + "On My Mac" account
          open -a Notes
          sleep 3
          killall Notes 2>/dev/null || true
          sleep 1

          # Step 2: Relaunch and dismiss both startup dialogs
          open -a Notes
          sleep 3

          echo "Dismissing Welcome dialog..."
          /usr/bin/osascript -l JavaScript -e '
            var se = Application("System Events");
            var p = se.processes.byName("Notes");
            var wins = p.windows();
            for (var i = 0; i < wins.length; i++) {
              var buttons = wins[i].buttons();
              for (var j = 0; j < buttons.length; j++) {
                try { if (buttons[j].name() === "Continue") buttons[j].click(); } catch(e) {}
              }
            }
          ' 2>/dev/null || true
          sleep 2

          echo "Dismissing Turn On iCloud sheet..."
          /usr/bin/osascript -l JavaScript -e '
            var se = Application("System Events");
            var p = se.processes.byName("Notes");
            var wins = p.windows();
            for (var i = 0; i < wins.length; i++) {
              try {
                var sheets = wins[i].sheets();
                for (var s = 0; s < sheets.length; s++) {
                  var buttons = sheets[s].buttons();
                  for (var b = 0; b < buttons.length; b++) {
                    try {
                      if (buttons[b].name() !== "System Settings") {
                        buttons[b].click();
                        break;
                      }
                    } catch(e) {}
                  }
                }
              } catch(e) {}
            }
          ' 2>/dev/null || true
          sleep 2

          # Step 3: Kill and relaunch Notes with a clean state
          # The scripting bridge may need a fresh app process after dialogs
          echo "Kill and relaunch for clean scripting bridge..."
          killall Notes 2>/dev/null || true
          sleep 2
          open -a Notes
          sleep 5

          # Check for any new dialogs after relaunch
          echo "UI state after fresh relaunch:"
          /usr/bin/osascript -l JavaScript -e '
            var se = Application("System Events");
            var p = se.processes.byName("Notes");
            var wins = p.windows();
            var result = [];
            for (var i = 0; i < wins.length; i++) {
              var w = wins[i];
              var info = {};
              try { info.name = w.name(); } catch(e) {}
              try { info.sheets = w.sheets().length; } catch(e) {}
              try {
                info.buttons = w.buttons().map(function(b) {
                  try { return b.name() || b.description(); } catch(e) { return "?"; }
                });
              } catch(e) {}
              try {
                info.staticTexts = w.staticTexts().slice(0,5).map(function(t) {
                  try { return t.value(); } catch(e) { return "?"; }
                });
              } catch(e) {}
              result.push(info);
            }
            JSON.stringify(result, null, 2);
          ' 2>&1 || true

          # Dismiss any dialogs that reappeared
          /usr/bin/osascript -l JavaScript -e '
            var se = Application("System Events");
            var p = se.processes.byName("Notes");
            var wins = p.windows();
            for (var i = 0; i < wins.length; i++) {
              // Welcome dialog
              try {
                var buttons = wins[i].buttons();
                for (var j = 0; j < buttons.length; j++) {
                  try { if (buttons[j].name() === "Continue") buttons[j].click(); } catch(e) {}
                }
              } catch(e) {}
              // iCloud sheet
              try {
                var sheets = wins[i].sheets();
                for (var s = 0; s < sheets.length; s++) {
                  var sb = sheets[s].buttons();
                  for (var b = 0; b < sb.length; b++) {
                    try { if (sb[b].name() !== "System Settings") { sb[b].click(); break; } } catch(e) {}
                  }
                }
              } catch(e) {}
            }
          ' 2>/dev/null || true
          sleep 3

          # Step 4: Test data access — no screencapture to avoid permission dialogs
          echo ""
          echo "=== Testing data access ==="
          /usr/bin/osascript -l JavaScript -e '
            var app = Application("Notes");
            JSON.stringify({ok: true, accounts: app.accounts().length});
          ' &
          QUERY_PID=$!
          for i in $(seq 1 20); do
            if ! kill -0 $QUERY_PID 2>/dev/null; then break; fi
            sleep 1
          done
          if kill -0 $QUERY_PID 2>/dev/null; then
            echo "FAILED: Data query hanging after 20s"
            kill $QUERY_PID 2>/dev/null || true
            wait $QUERY_PID 2>/dev/null || true

            # Try AppleScript (not JXA) as a different code path
            echo "Trying AppleScript syntax..."
            /usr/bin/osascript -e 'tell application "Notes" to count accounts' &
            AS_PID=$!
            sleep 10
            if kill -0 $AS_PID 2>/dev/null; then
              echo "AppleScript also hangs"
              kill $AS_PID 2>/dev/null || true
              wait $AS_PID 2>/dev/null || true
            else
              wait $AS_PID && echo "AppleScript works!" || echo "AppleScript errored"
            fi
          else
            wait $QUERY_PID && echo "DATA ACCESS WORKS!" || echo "Query failed (but didn't hang)"
          fi

      - name: Run integration tests
        run: npm run test:integration
